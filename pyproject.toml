[project]
name = "agent-commerce-sim"
version = "0.1.0"
description = "Forsidia: a deterministic multi-agent commerce simulation with fast (System 1) and slow (System 2) agent decision models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pydantic-ai-slim[anthropic,openai]>=2.64.0"]
llm = [
    "pydantic-ai-slim[anthropic,openai]>=2.64.0",
]

[project.scripts]
acs = "acs.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "acs"

[tool.pytest.ini_options]
testpaths = ["tests"]
